<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WoW: Forever AH Flip Advisor (EU / Normal / Allianz)</title>
<style>
  :root {
    --bg: #0c0f14; --panel: #141923; --panel-2: #1b2230; --border: #283246;
    --text: #e6edf7; --muted: #8b9bb4; --gold: #f5b942; --green: #22c55e;
    --amber: #f59e0b; --red: #ef4444; --blue: #38bdf8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.45;
  }
  .wrap { max-width: 1440px; margin: 0 auto; padding: 20px; }
  header {
    display: flex; flex-wrap: wrap; gap: 14px; justify-content: space-between;
    align-items: center; padding-bottom: 16px; border-bottom: 1px solid var(--border);
  }
  h1 { margin: 0; font-size: 1.35rem; color: var(--gold); letter-spacing: 0.3px; }
  .sub { font-size: 0.85rem; color: var(--muted); margin-top: 3px; }
  .btn {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 0.85rem;
  }
  .btn:hover { border-color: var(--gold); color: var(--gold); }
  .banner {
    margin-top: 14px; padding: 12px 16px; border-radius: 10px;
    background: rgba(245, 158, 11, 0.12); border: 1px solid rgba(245, 158, 11, 0.4);
    color: #fde68a; font-size: 0.88rem; display: none;
  }
  .kpis {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 12px; margin: 16px 0;
  }
  .kpi {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px;
  }
  .kpi .lbl { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; }
  .kpi .val { font-size: 1.25rem; font-weight: 700; margin-top: 4px; }
  .filters {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: end;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 16px;
  }
  .fgroup { display: flex; flex-direction: column; gap: 4px; }
  .fgroup label { font-size: 0.74rem; color: var(--muted); }
  .fgroup input, .fgroup select {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    padding: 7px 10px; border-radius: 6px; font-size: 0.85rem;
  }
  .fcheck { display: flex; align-items: center; gap: 6px; padding: 7px 4px; font-size: 0.85rem; }
  .grid { display: grid; grid-template-columns: 1.55fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 1080px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden;
  }
  .table-wrap { overflow-x: auto; max-height: 74vh; }
  table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
  th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--panel-2); color: var(--muted); font-size: 0.74rem; text-transform: uppercase; z-index: 2; }
  tbody tr { cursor: pointer; transition: background 0.12s; }
  tbody tr:hover { background: rgba(245, 185, 66, 0.07); }
  tbody tr.active { background: rgba(245, 185, 66, 0.14); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .badge {
    display: inline-block; padding: 2px 7px; border-radius: 999px; font-weight: 700; font-size: 0.76rem;
  }
  .b-high { background: rgba(34, 197, 94, 0.18); color: var(--green); }
  .b-mid { background: rgba(245, 158, 11, 0.18); color: var(--amber); }
  .b-low { background: rgba(239, 68, 68, 0.18); color: var(--red); }
  .flag {
    display: inline-block; font-size: 0.68rem; padding: 1px 5px; border-radius: 4px;
    background: rgba(239, 68, 68, 0.2); color: #fca5a5; margin-left: 5px; vertical-align: middle;
  }
  .item-cell { display: inline-flex; align-items: center; gap: 8px; }
  .item-icon {
    width: 26px; height: 26px; border-radius: 5px; object-fit: cover;
    background: #0c0f14; flex-shrink: 0; border: 1.5px solid #475569;
  }
  .item-icon-lg { width: 38px; height: 38px; border-radius: 7px; }
  .item-icon-fallback {
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 0.75rem; font-weight: 700; color: var(--muted);
  }
  .qb-POOR { border-color: #9d9d9d; } .qb-COMMON { border-color: #cbd5e1; }
  .qb-UNCOMMON { border-color: #1eff00; } .qb-RARE { border-color: #0070dd; }
  .qb-EPIC { border-color: #a335ee; } .qb-LEGENDARY { border-color: #ff8000; }
  .detail { padding: 16px; position: sticky; top: 16px; }
  .detail-head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .detail h2 { margin: 0; font-size: 1.12rem; }
  .action-box {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px; margin: 12px 0; font-size: 0.87rem;
  }
  .action-row { display: flex; justify-content: space-between; gap: 10px; margin: 5px 0; }
  .sec-title { font-size: 0.76rem; color: var(--muted); text-transform: uppercase; margin: 14px 0 6px; }
  .chart-box {
    position: relative; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px; user-select: none;
  }
  .chart-legend {
    display: flex; flex-wrap: wrap; gap: 10px; font-size: 0.72rem;
    color: var(--muted); margin-bottom: 4px;
  }
  .leg-dot {
    display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px;
    vertical-align: middle;
  }
  .chart-tooltip {
    position: absolute; top: 30px; pointer-events: none; display: none;
    background: rgba(15, 20, 30, 0.96); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; font-size: 0.76rem; min-width: 175px;
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.55); z-index: 10;
  }
  .ct-time { font-weight: 700; color: var(--gold); margin-bottom: 4px; border-bottom: 1px solid var(--border); padding-bottom: 3px; }
  .ct-row { display: flex; justify-content: space-between; gap: 12px; margin: 2px 0; }
  .hm { display: grid; grid-template-columns: 34px repeat(6, 1fr); gap: 3px; font-size: 0.7rem; }
  .hm-cell {
    padding: 5px 2px; text-align: center; border-radius: 4px; background: var(--bg);
    color: var(--text); border: 1px solid rgba(255,255,255,0.04);
  }
  .hm-head { color: var(--muted); text-align: center; padding: 2px; font-size: 0.68rem; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .q-POOR { color: #9d9d9d; } .q-COMMON { color: #ffffff; } .q-UNCOMMON { color: #1eff00; }
  .q-RARE { color: #0070dd; } .q-EPIC { color: #a335ee; } .q-LEGENDARY { color: #ff8000; }
  .g { color: #ffd700; } .s { color: #c7c7cf; } .c { color: #eda55f; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>WoW: Forever AH Flip Advisor</h1>
      <div class="sub" id="metaLine">Lade Live-Daten...</div>
    </div>
    <div>
      <button class="btn" onclick="loadData()">Daten neu laden</button>
    </div>
  </header>

  <div class="banner" id="statusBanner"></div>

  <div class="kpis">
    <div class="kpi"><div class="lbl">Empfohlene Flips</div><div class="val" id="kCount">-</div></div>
    <div class="kpi"><div class="lbl">Bester Flip-Score</div><div class="val" id="kTopScore" style="color:var(--green)">-</div></div>
    <div class="kpi"><div class="lbl">Ø Netto-ROI (gefiltert)</div><div class="val" id="kAvgRoi" style="color:var(--gold)">-</div></div>
    <div class="kpi"><div class="lbl">Datenbasis (Ziel: 168h)</div><div class="val" id="kHistory">-</div></div>
  </div>

  <div class="filters">
    <div class="fgroup">
      <label>Item suchen</label>
      <input type="text" id="fSearch" placeholder="z.B. Lotus, Erz..." oninput="render()" />
    </div>
    <div class="fgroup">
      <label>Kategorie</label>
      <select id="fClass" onchange="render()">
        <option value="">Alle Kategorien</option>
      </select>
    </div>
    <div class="fgroup">
      <label>Min. Score</label>
      <input type="number" id="fScore" value="25" min="0" max="100" style="width:82px" oninput="render()" />
    </div>
    <div class="fgroup">
      <label>Min. Gewinn (Gold)</label>
      <input type="number" id="fMinProfit" placeholder="0" min="0" step="0.5" style="width:98px" oninput="render()" />
    </div>
    <div class="fgroup">
      <label>Min. Flip-Rate %/Tag</label>
      <input type="number" id="fFlip" value="0" min="0" max="100" style="width:100px" oninput="render()" />
    </div>
    <div class="fgroup">
      <label>Max. Einkauf (Gold)</label>
      <input type="number" id="fMaxGold" placeholder="alle" min="0" style="width:98px" oninput="render()" />
    </div>
    <div class="fgroup">
      <label>Sortierung</label>
      <select id="fSort" onchange="render()">
        <option value="score">Flip-Score (hoch -> niedrig)</option>
        <option value="net_profit">Netto-Gewinn / Stk</option>
        <option value="net_roi_pct">Netto-ROI %</option>
        <option value="flip_rate_pct">Flip-Rate %/Tag</option>
        <option value="daily_sold_est">Verkäufe / Tag</option>
      </select>
    </div>
    <label class="fcheck">
      <input type="checkbox" id="fSafeOnly" onchange="render()" />
      Ohne Warn-Flags
    </label>
  </div>

  <div class="grid">
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Score</th>
              <th>Item</th>
              <th class="num">Kauf jetzt</th>
              <th class="num">Ziel-VK</th>
              <th class="num">Netto/Stk</th>
              <th class="num">ROI</th>
              <th class="num">Flip/Tag</th>
              <th>Kauf-Fenster</th>
              <th>VK-Fenster</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>

    <div class="card detail" id="detailPanel">
      <div class="sub">Wähle links ein Item für Preisverlauf, Zeitfenster-Heatmap und Kaufplan.</div>
    </div>
  </div>
</div>

<script>
let DATA = null;
let SELECTED_ID = null;

function esc(str) {
  return String(str ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function fmtGoldHtml(copper) {
  const neg = copper < 0 ? '-' : '';
  const abs = Math.round(Math.abs(copper));
  const g = Math.floor(abs / 10000);
  const s = Math.floor((abs % 10000) / 100);
  const c = abs % 100;
  let out = neg;
  if (g > 0) out += `<span class="g">${g}g</span> `;
  if (g > 0 || s > 0) out += `<span class="s">${String(s).padStart(g > 0 ? 2 : 1, '0')}s</span> `;
  out += `<span class="c">${String(c).padStart((g > 0 || s > 0) ? 2 : 1, '0')}c</span>`;
  return out;
}

function fmtGoldPlain(copper) {
  const abs = Math.round(Math.abs(copper));
  const g = Math.floor(abs / 10000);
  const s = Math.floor((abs % 10000) / 100);
  const c = abs % 100;
  return `${copper < 0 ? '-' : ''}${g}g ${s}s ${c}c`;
}

function fmtShortDate(ts) {
  const d = new Date(ts * 1000);
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const hh = String(d.getHours()).padStart(2, '0');
  const mi = String(d.getMinutes()).padStart(2, '0');
  return `${dd}.${mm}. ${hh}:${mi}`;
}

function iconHtml(item, large = false) {
  const cls = `item-icon ${large ? 'item-icon-lg' : ''} qb-${esc(item.quality || 'COMMON')}`;
  if (item.icon_url) {
    return `<img class="${cls}" src="${esc(item.icon_url)}" alt="" loading="lazy" onerror="this.outerHTML='<span class=&quot;${cls} item-icon-fallback&quot;>?</span>'" />`;
  }
  return `<span class="${cls} item-icon-fallback">?</span>`;
}

function populateCategories() {
  const sel = document.getElementById('fClass');
  const prev = sel.value;
  const classes = [...new Set((DATA?.flips || []).map(x => x.item_class).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">Alle Kategorien</option>' +
    classes.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
  if (classes.includes(prev)) sel.value = prev;
}

async function loadData() {
  try {
    const res = await fetch('./flips_export.json?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    DATA = await res.json();
    const dt = new Date(DATA.updated_utc * 1000).toLocaleString('de-DE');
    document.getElementById('metaLine').textContent =
      `${DATA.market} | Letzter Sync: ${dt} | ${DATA.total_listings.toLocaleString('de-DE')} Auktionen`;
    document.getElementById('kHistory').textContent = `${DATA.snapshots} Scans (${DATA.hours_span}h)`;

    const banner = document.getElementById('statusBanner');
    if (DATA.status === 'collecting' || DATA.snapshots < 24) {
      banner.style.display = 'block';
      banner.textContent = DATA.status === 'collecting'
        ? 'Datenbasis im Startmodus: Flip-Raten starten nach zwei unterschiedlichen Stundenscans. Wochentags-Prognosen werden nach 3 bis 7 Tagen belastbar.'
        : `Historie im Aufbau (${DATA.snapshots} Snapshots / ${DATA.hours_span}h): Flip-Raten laufen bereits, Wochentags-Muster stabilisieren sich über die ersten 7 Tage.`;
    } else {
      banner.style.display = 'none';
    }
    populateCategories();
    render();
  } catch (err) {
    document.getElementById('metaLine').textContent = 'Noch keine flips_export.json gefunden. Bitte GitHub Action einmal ausführen.';
  }
}

function getFiltered() {
  if (!DATA || !DATA.flips) return [];
  const q = document.getElementById('fSearch').value.trim().toLowerCase();
  const cat = document.getElementById('fClass').value;
  const minScore = Number(document.getElementById('fScore').value) || 0;
  const minProfitRaw = document.getElementById('fMinProfit').value;
  const minProfitCopper = minProfitRaw !== '' ? Number(minProfitRaw) * 10000 : 0;
  const minFlip = Number(document.getElementById('fFlip').value) || 0;
  const maxGoldRaw = document.getElementById('fMaxGold').value;
  const maxCopper = maxGoldRaw !== '' ? Number(maxGoldRaw) * 10000 : Infinity;
  const safeOnly = document.getElementById('fSafeOnly').checked;
  const sortKey = document.getElementById('fSort').value;

  return DATA.flips
    .filter(x =>
      (!q || x.name.toLowerCase().includes(q) || String(x.item_id).includes(q)) &&
      (!cat || x.item_class === cat) &&
      x.score >= minScore &&
      x.net_profit >= minProfitCopper &&
      x.flip_rate_pct >= minFlip &&
      x.buy_now <= maxCopper &&
      (!safeOnly || x.flags.length === 0)
    )
    .sort((a, b) => b[sortKey] - a[sortKey]);
}

function render() {
  const list = getFiltered();
  document.getElementById('kCount').textContent = list.length;
  document.getElementById('kTopScore').textContent = list.length ? list[0].score.toFixed(1) : '-';
  const avgRoi = list.length ? list.reduce((s, x) => s + x.net_roi_pct, 0) / list.length : 0;
  document.getElementById('kAvgRoi').textContent = list.length ? avgRoi.toFixed(1) + '%' : '-';

  const tbody = document.getElementById('tbody');
  if (!list.length) {
    tbody.innerHTML = '<tr><td colspan="9" style="color:var(--muted);text-align:center;padding:24px">Keine Items passen zu den aktuellen Filtern.</td></tr>';
    return;
  }

  if (!SELECTED_ID || !list.some(x => x.item_id === SELECTED_ID)) {
    SELECTED_ID = list[0].item_id;
  }

  tbody.innerHTML = list.map(x => {
    const cls = x.score >= 70 ? 'b-high' : x.score >= 45 ? 'b-mid' : 'b-low';
    const flagsHtml = x.flags.map(f => `<span class="flag">${esc(f)}</span>`).join('');
    return `
      <tr class="${x.item_id === SELECTED_ID ? 'active' : ''}" onclick="selectItem(${x.item_id})">
        <td><span class="badge ${cls}">${x.score.toFixed(0)}</span></td>
        <td>
          <div class="item-cell">
            ${iconHtml(x, false)}
            <span><span class="q-${esc(x.quality)}">${esc(x.name)}</span>${flagsHtml}</span>
          </div>
        </td>
        <td class="num">${fmtGoldHtml(x.buy_now)}</td>
        <td class="num">${fmtGoldHtml(x.target_sell)}</td>
        <td class="num" style="color:var(--green)">${fmtGoldHtml(x.net_profit)}</td>
        <td class="num">${x.net_roi_pct.toFixed(1)}%</td>
        <td class="num">${x.flip_rate_pct.toFixed(0)}%</td>
        <td>${esc(x.best_buy_window)}</td>
        <td>${esc(x.best_sell_window)}</td>
      </tr>`;
  }).join('');

  renderDetail(list.find(x => x.item_id === SELECTED_ID));
}

function selectItem(id) {
  SELECTED_ID = id;
  render();
}

function normalizeHistory(raw) {
  return (raw || []).map(p => ({
    ts: p[0],
    min: p[1],
    ref: p[2],
    med: p.length >= 4 ? p[3] : p[2],
    qty: p.length >= 5 ? p[4] : null
  }));
}

function buildChartHtml(item) {
  const pts = normalizeHistory(item.history);
  const refLbl = esc(item.ref_label || 'P10/P25');
  if (pts.length < 2) {
    return '<div class="sub" style="padding:18px;text-align:center">Preisverlauf erscheint ab 2 unterschiedlichen Snapshots.</div>';
  }

  const w = 440, ht = 172, padL = 14, padR = 14, padT = 16, padB = 22;
  const minTs = pts[0].ts;
  const maxTs = pts[pts.length - 1].ts;
  const tsSpan = Math.max(1, maxTs - minTs);

  const vals = pts.flatMap(p => [p.min, p.ref]).concat([item.buy_now, item.target_sell]);
  const minV = Math.min(...vals) * 0.94;
  const maxV = Math.max(...vals) * 1.06 || 1;

  const sx = ts => padL + ((ts - minTs) / tsSpan) * (w - padL - padR);
  const sy = v => ht - padB - ((v - minV) / (maxV - minV)) * (ht - padT - padB);

  const refPath = pts.map(p => `${sx(p.ts).toFixed(1)},${sy(p.ref).toFixed(1)}`).join(' ');
  const minPath = pts.map(p => `${sx(p.ts).toFixed(1)},${sy(p.min).toFixed(1)}`).join(' ');
  const yBuy = sy(item.buy_now).toFixed(1);
  const ySell = sy(item.target_sell).toFixed(1);

  return `
    <div class="chart-legend">
      <span><i class="leg-dot" style="background:#38bdf8"></i>Marktpreis (${refLbl})</span>
      <span><i class="leg-dot" style="background:#94a3b8"></i>Min-Preis</span>
      <span><i class="leg-dot" style="background:#f5b942"></i>Ziel-VK</span>
      <span><i class="leg-dot" style="background:#22c55e"></i>Kauf</span>
    </div>
    <svg id="priceChartSvg" viewBox="0 0 ${w} ${ht}" style="width:100%;height:auto;display:block;touch-action:none">
      <line x1="${padL}" y1="${ySell}" x2="${w-padR}" y2="${ySell}" stroke="#f5b942" stroke-dasharray="4 4" stroke-width="1.2"/>
      <line x1="${padL}" y1="${yBuy}" x2="${w-padR}" y2="${yBuy}" stroke="#22c55e" stroke-dasharray="4 4" stroke-width="1.2"/>
      <polyline fill="none" stroke="#38bdf8" stroke-width="2" points="${refPath}"/>
      <polyline fill="none" stroke="#94a3b8" stroke-width="1.3" opacity="0.75" points="${minPath}"/>
      <text x="${padL+2}" y="${Math.max(12, Number(ySell)-4)}" fill="#f5b942" font-size="9.5">Ziel-VK: ${fmtGoldPlain(item.target_sell)}</text>
      <text x="${padL+2}" y="${Math.min(ht-padB-3, Number(yBuy)+11)}" fill="#22c55e" font-size="9.5">Kauf: ${fmtGoldPlain(item.buy_now)}</text>
      <text x="${padL}" y="${ht-5}" fill="#8b9bb4" font-size="9">${fmtShortDate(minTs)}</text>
      <text x="${w-padR}" y="${ht-5}" fill="#8b9bb4" font-size="9" text-anchor="end">${fmtShortDate(maxTs)}</text>

      <line id="chLine" x1="0" y1="${padT}" x2="0" y2="${ht-padB}" stroke="#e2e8f0" stroke-dasharray="2 2" stroke-width="1" opacity="0"/>
      <circle id="chDotRef" cx="0" cy="0" r="4" fill="#38bdf8" stroke="#0c0f14" stroke-width="1.5" opacity="0"/>
      <circle id="chDotMin" cx="0" cy="0" r="3.5" fill="#94a3b8" stroke="#0c0f14" stroke-width="1.5" opacity="0"/>
      <rect id="chOverlay" x="0" y="0" width="${w}" height="${ht}" fill="transparent" style="cursor:crosshair"/>
    </svg>
    <div class="chart-tooltip" id="chartTooltip"></div>
  `;
}

function attachChartHover(item) {
  const svg = document.getElementById('priceChartSvg');
  const overlay = document.getElementById('chOverlay');
  const tooltip = document.getElementById('chartTooltip');
  if (!svg || !overlay || !tooltip) return;

  const pts = normalizeHistory(item.history);
  if (pts.length < 2) return;

  const w = 440, ht = 172, padL = 14, padR = 14, padT = 16, padB = 22;
  const minTs = pts[0].ts;
  const tsSpan = Math.max(1, pts[pts.length - 1].ts - minTs);
  const vals = pts.flatMap(p => [p.min, p.ref]).concat([item.buy_now, item.target_sell]);
  const minV = Math.min(...vals) * 0.94;
  const maxV = Math.max(...vals) * 1.06 || 1;
  const sx = ts => padL + ((ts - minTs) / tsSpan) * (w - padL - padR);
  const sy = v => ht - padB - ((v - minV) / (maxV - minV)) * (ht - padT - padB);

  const line = document.getElementById('chLine');
  const dotRef = document.getElementById('chDotRef');
  const dotMin = document.getElementById('chDotMin');
  const refLbl = esc(item.ref_label || 'P10/P25');

  const updateAtClientX = (clientX) => {
    const rect = svg.getBoundingClientRect();
    const relX = ((clientX - rect.left) / rect.width) * w;

    let best = pts[0];
    let bestDist = Infinity;
    for (const p of pts) {
      const d = Math.abs(sx(p.ts) - relX);
      if (d < bestDist) {
        bestDist = d;
        best = p;
      }
    }

    const cx = sx(best.ts);
    const cyRef = sy(best.ref);
    const cyMin = sy(best.min);

    line.setAttribute('x1', cx);
    line.setAttribute('x2', cx);
    line.setAttribute('opacity', '0.65');
    dotRef.setAttribute('cx', cx);
    dotRef.setAttribute('cy', cyRef);
    dotRef.setAttribute('opacity', '1');
    dotMin.setAttribute('cx', cx);
    dotMin.setAttribute('cy', cyMin);
    dotMin.setAttribute('opacity', '1');

    tooltip.innerHTML = `
      <div class="ct-time">${fmtShortDate(best.ts)} Uhr</div>
      <div class="ct-row"><span>Marktpreis (${refLbl}):</span><span>${fmtGoldHtml(best.ref)}</span></div>
      <div class="ct-row"><span>Min-Preis:</span><span>${fmtGoldHtml(best.min)}</span></div>
      <div class="ct-row"><span>Median (Info):</span><span>${fmtGoldHtml(best.med)}</span></div>
      ${best.qty !== null ? `<div class="ct-row"><span>AH-Bestand:</span><span>${best.qty} Stk</span></div>` : ''}
    `;
    tooltip.style.display = 'block';

    const pctX = cx / w;
    if (pctX > 0.55) {
      tooltip.style.left = '10px';
      tooltip.style.right = 'auto';
    } else {
      tooltip.style.right = '10px';
      tooltip.style.left = 'auto';
    }
  };

  const hide = () => {
    line.setAttribute('opacity', '0');
    dotRef.setAttribute('opacity', '0');
    dotMin.setAttribute('opacity', '0');
    tooltip.style.display = 'none';
  };

  overlay.addEventListener('mousemove', e => updateAtClientX(e.clientX));
  overlay.addEventListener('mouseleave', hide);
  overlay.addEventListener('touchstart', e => {
    if (e.touches[0]) updateAtClientX(e.touches[0].clientX);
  }, { passive: true });
  overlay.addEventListener('touchmove', e => {
    if (e.touches[0]) updateAtClientX(e.touches[0].clientX);
  }, { passive: true });
}

function buildHeatmap(hm) {
  const vals = Object.values(hm || {});
  if (!vals.length) return '<div class="sub">Noch keine Zeitfenster-Daten vorhanden.</div>';
  const minV = Math.min(...vals), maxV = Math.max(...vals);
  const days = ['Mo','Di','Mi','Do','Fr','Sa','So'];
  const blocks = [0,4,8,12,16,20];
  let html = '<div class="hm"><div></div>' + blocks.map(b => `<div class="hm-head">${b}-${b+4}h</div>`).join('');
  days.forEach((d, wd) => {
    html += `<div class="hm-head" style="text-align:left;padding-top:5px">${d}</div>`;
    blocks.forEach(b => {
      const v = hm[`${wd}_${b}`];
      if (v === undefined) {
        html += '<div class="hm-cell" style="color:var(--muted)">-</div>';
      } else {
        const ratio = maxV === minV ? 0.5 : (v - minV) / (maxV - minV);
        const bg = ratio < 0.35
          ? `rgba(34,197,94,${0.35 - ratio * 0.5})`
          : ratio > 0.65
          ? `rgba(245,185,66,${0.12 + (ratio - 0.65) * 0.9})`
          : 'rgba(148,163,184,0.08)';
        html += `<div class="hm-cell" style="background:${bg}" title="${d} ${b}-${b+4}h: ${fmtGoldPlain(v)}">${(v/10000).toFixed(1)}g</div>`;
      }
    });
  });
  return html + '</div>';
}

function copySelectedName(btn) {
  const item = (DATA?.flips || []).find(x => x.item_id === SELECTED_ID);
  if (!item) return;
  navigator.clipboard.writeText(item.name);
  const old = btn.textContent;
  btn.textContent = 'Kopiert!';
  setTimeout(() => btn.textContent = old, 1200);
}

function renderDetail(item) {
  const el = document.getElementById('detailPanel');
  if (!item) return;
  const totalInv = item.buy_now * item.rec_qty;
  const totalNet = item.net_profit * item.rec_qty;
  const refLbl = esc(item.ref_label || 'P10/P25');
  const floorInfo = item.bottom_qty !== undefined ? `${item.bottom_qty} Stk` : '-';
  const classText = item.item_class ? ` | ${esc(item.item_class)}` : '';

  el.innerHTML = `
    <div class="detail-head">
      ${iconHtml(item, true)}
      <div>
        <h2 class="q-${esc(item.quality)}">${esc(item.name)}</h2>
        <div class="sub">ID #${item.item_id}${classText} | Bestand: ${item.cur_qty} | Verkäufe/Tag: ${item.daily_sold_est}</div>
      </div>
    </div>

    <div class="action-box">
      <div class="action-row"><span>Empfohlene Kaufmenge:</span><strong>${item.rec_qty} Stk</strong></div>
      <div class="action-row"><span>Günstigster Bestand (+5% Floor):</span><span>${floorInfo}</span></div>
      <div class="action-row"><span>Max. Einkaufspreis / Stk:</span><span>${fmtGoldHtml(item.buy_now)}</span></div>
      <div class="action-row"><span>Fair Value (${refLbl}):</span><span>${fmtGoldHtml(item.fair_value)}</span></div>
      <div class="action-row"><span>Ziel-Verkaufspreis / Stk:</span><span>${fmtGoldHtml(item.target_sell)}</span></div>
      <div class="action-row"><span>Gesch. Relist-Deposit / Stk:</span><span>${fmtGoldHtml(item.est_deposit)}</span></div>
      <div class="action-row" style="border-top:1px solid var(--border);padding-top:6px;margin-top:6px">
        <span>Gesamt-Invest -> Netto-Gewinn:</span>
        <span>${fmtGoldHtml(totalInv)} -> <strong style="color:var(--green)">+${fmtGoldHtml(totalNet)}</strong></span>
      </div>
      <div class="action-row"><span>Bestes Kauf- / VK-Fenster:</span><span>${esc(item.best_buy_window)} / ${esc(item.best_sell_window)}</span></div>
    </div>

    <div class="sec-title">Interaktiver Preisverlauf (Maus drüberfahren für Details)</div>
    <div class="chart-box">${buildChartHtml(item)}</div>

    <div class="sec-title">Timing-Heatmap auf ${refLbl}-Basis (Grün = kaufen | Gold = verkaufen)</div>
    ${buildHeatmap(item.heatmap)}

    <div class="tools">
      <button class="btn" onclick="copySelectedName(this)">Name für Auctionator kopieren</button>
      <a class="btn" style="text-decoration:none" target="_blank" rel="noopener" href="https://www.wowhead.com/classic/de/item=${item.item_id}">Wowhead öffnen</a>
    </div>
  `;

  attachChartHover(item);
}

loadData();
</script>
